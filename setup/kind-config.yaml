kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: yunikorn-cluster
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443 
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 9889
    hostPort: 9889
    protocol: TCP
  - containerPort: 9080
    hostPort: 9080
    protocol: TCP
- role: worker
- role: worker

